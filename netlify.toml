[build]
  command = "python build.py"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  directory = "netlify/functions"
  included_files = [
    "templates/**",
    "blueprints/**",
    "database/**",
    "models/**",
    "services/**",
    "static/**",
    "config.py",
    "app.py"
  ]

[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200
